<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall Duel</title>
<style>
  :root {
    --gold: #f2c14e;
    --gold-dim: #9a7a2e;
    --ember: #ff8c42;
    --teal: #2ee6c8;
    --ink: #14100c;
    --parchment: #fdf3d8;
    --parchment-dim: #efdfba;
    --card-w: 118px;
    --card-h: 158px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, Verdana, sans-serif;
    color: #f5ecd7;
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(255, 140, 66, .38), transparent 70%),
      radial-gradient(1100px 700px at 50% 115%, rgba(46, 230, 200, .16), transparent 70%),
      linear-gradient(160deg, #0b2e2b 0%, #0a2422 55%, #071a19 100%);
    overflow: hidden;
    user-select: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #app { height: 100dvh; max-width: 1120px; margin: 0 auto; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 6px; }

  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand { font-size: 15px; font-weight: 800; letter-spacing: .22em; color: var(--gold); }
  .brand small { color: #a8cfc8; letter-spacing: .1em; }
  .turn-tag { font-size: 14px; font-weight: 700; letter-spacing: .12em; color: #bfeee4; }
  .log {
    min-height: 22px; text-align: center; font-size: 15px; color: #ffe9b0;
    background: rgba(0,0,0,.28); border: 1px solid rgba(242,193,78,.35); border-radius: 8px; padding: 3px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .duelist { display: flex; align-items: center; gap: 12px; }
  .life-orb {
    width: 72px; height: 72px; border-radius: 50%; flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #ff9d5c, #d43d1e 62%, #8f1f0d);
    border: 3px solid var(--gold); box-shadow: 0 0 18px rgba(255,120,50,.55), inset 0 -8px 14px rgba(0,0,0,.35);
  }
  .life-orb.player { background: radial-gradient(circle at 35% 30%, #7ef0d4, #159e86 62%, #0a5f52); box-shadow: 0 0 18px rgba(46,230,200,.5), inset 0 -8px 14px rgba(0,0,0,.35); }
  .life-orb .life-num { font-size: 30px; font-weight: 900; line-height: 1; text-shadow: 0 2px 3px rgba(0,0,0,.5); }
  .life-orb .life-cap { font-size: 9px; font-weight: 800; letter-spacing: .18em; opacity: .9; }
  .duelist .who { line-height: 1.15; }
  .duelist .who .name { font-size: 17px; font-weight: 800; letter-spacing: .04em; }
  .duelist .who .sub { font-size: 12px; color: #a8cfc8; letter-spacing: .08em; }
  .pile { text-align: center; font-size: 12px; color: #a8cfc8; letter-spacing: .06em; }
  .pile .deck-glyph { font-size: 26px; color: var(--gold); line-height: 1; }
  .pile .deck-count { font-size: 16px; font-weight: 800; color: #f5ecd7; }

  .crystals { display: flex; align-items: center; gap: 3px; font-size: 20px; }
  .crystals .on { color: var(--teal); text-shadow: 0 0 8px rgba(46,230,200,.8); }
  .crystals .off { color: rgba(255,255,255,.18); }
  .crystals .cap { font-size: 12px; color: #a8cfc8; margin-right: 6px; letter-spacing: .1em; font-weight: 700; }

  .board { display: flex; justify-content: center; gap: 14px; }
  .slot {
    width: var(--card-w); height: var(--card-h); border-radius: 12px; position: relative;
    border: 3px dashed rgba(245,236,215,.22); background: rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
    color: rgba(245,236,215,.3); font-size: 30px; font-weight: 900;
  }
  .slot.filled { border: none; background: none; }
  .slot.targetable { border-color: var(--gold); color: var(--gold); cursor: pointer; animation: pulse 0.9s ease-in-out infinite alternate; background: rgba(242,193,78,.08); }
  @keyframes pulse { from { box-shadow: 0 0 4px rgba(242,193,78,.25); } to { box-shadow: 0 0 16px rgba(242,193,78,.65); } }

  .card {
    width: var(--card-w); height: var(--card-h); border-radius: 12px; position: relative;
    background: linear-gradient(165deg, var(--parchment) 0%, var(--parchment-dim) 100%);
    border: 4px solid #2b2015; color: var(--ink);
    display: flex; flex-direction: column; align-items: stretch;
    box-shadow: 0 6px 14px rgba(0,0,0,.45);
    font-family: inherit; text-align: center; padding: 0;
  }
  button.card { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  button.card:hover { transform: translateY(-10px); box-shadow: 0 14px 22px rgba(0,0,0,.5), 0 0 18px rgba(242,193,78,.55); }
  button.card.unaffordable:hover { transform: none; box-shadow: 0 6px 14px rgba(0,0,0,.45); }
  .card.flash { animation: hitflash .55s ease-out; }
  @keyframes hitflash {
    0% { box-shadow: 0 0 0 4px #ff5147, 0 0 26px rgba(255,60,40,.95); transform: translateX(0); }
    25% { transform: translateX(-4px); }
    55% { transform: translateX(4px); }
    100% { box-shadow: 0 6px 14px rgba(0,0,0,.45); transform: translateX(0); }
  }
  .card .cost {
    position: absolute; top: -10px; left: -10px; width: 32px; height: 32px; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #8ff5e2, #12a68c 70%);
    border: 3px solid #0b3d35; border-radius: 9px; transform: rotate(45deg);
    font-size: 17px; font-weight: 900; color: #04231d;
  }
  .card .cost span { transform: rotate(-45deg); }
  .card .cname {
    font-size: 13.5px; font-weight: 900; letter-spacing: .02em; line-height: 1.1;
    padding: 7px 6px 3px; min-height: 34px; display: flex; align-items: center; justify-content: center;
  }
  .card .art {
    margin: 0 8px; height: 58px; border-radius: 8px; flex: 0 0 auto;
    background: radial-gradient(circle at 50% 38%, #3a2c1c, #191008 78%);
    border: 2px solid rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; line-height: 1;
  }
  .card .ctext { font-size: 10.5px; line-height: 1.25; padding: 4px 7px 2px; color: #4a3a22; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
  .card .stats { display: flex; justify-content: space-between; padding: 0 6px 6px; margin-top: auto; }
  .badge {
    min-width: 30px; height: 30px; padding: 0 5px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #fff; border: 2.5px solid rgba(0,0,0,.55);
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .badge.atk { background: radial-gradient(circle at 35% 30%, #ffb35c, #e06414 72%); }
  .badge.hp { background: radial-gradient(circle at 35% 30%, #ff7d6b, #c22e1c 72%); }
  .badge.hp.hurt { background: radial-gradient(circle at 35% 30%, #ff5147, #8f0f0f 72%); outline: 2px solid #ffd23c; }
  .card.spell .art { background: radial-gradient(circle at 50% 38%, #4a3410, #241703 78%); }
  .card.selected { outline: 4px solid var(--gold); transform: translateY(-14px); box-shadow: 0 16px 26px rgba(0,0,0,.55), 0 0 18px rgba(242,193,78,.7); }
  .card.unaffordable { filter: grayscale(.55) brightness(.82); }

  .hand { display: flex; justify-content: center; align-items: flex-end; gap: 10px; min-height: var(--card-h); }
  .hand .empty-hand { color: rgba(245,236,215,.4); font-size: 14px; letter-spacing: .08em; align-self: center; }

  .backs { display: flex; gap: 6px; }
  .card-back {
    width: 44px; height: 62px; border-radius: 7px;
    background:
      radial-gradient(circle at 50% 45%, rgba(242,193,78,.85) 0 7px, transparent 8px),
      repeating-linear-gradient(45deg, #5a2410 0 7px, #74310f 7px 14px);
    border: 2.5px solid var(--gold-dim);
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }

  #end-turn {
    font-family: inherit; font-size: 17px; font-weight: 900; letter-spacing: .1em;
    color: #2a1a02; background: linear-gradient(180deg, #ffd968, #e8a91c);
    border: 3px solid #7a5a08; border-radius: 12px; padding: 12px 22px; cursor: pointer;
    box-shadow: 0 5px 0 #7a5a08, 0 8px 16px rgba(0,0,0,.45);
  }
  #end-turn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a5a08; }
  #end-turn:disabled { filter: grayscale(.7) brightness(.7); cursor: default; }

  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(4, 10, 10, .78);
  }
  .panel {
    text-align: center; max-width: 620px; padding: 34px 44px; border-radius: 18px;
    background: linear-gradient(170deg, rgba(16,42,40,.97), rgba(8,22,21,.97));
    border: 3px solid var(--gold-dim); box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 40px rgba(255,140,66,.18);
  }
  .panel h1 {
    margin: 0 0 6px; font-size: 52px; font-weight: 900; letter-spacing: .06em; line-height: 1.05;
    background: linear-gradient(180deg, #ffe9a8, #ff8c42 75%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel h1.teal { background: linear-gradient(180deg, #c8fff4, #2ee6c8 75%); -webkit-background-clip: text; background-clip: text; }
  .panel h1.red { background: linear-gradient(180deg, #ffc4b8, #e03c1e 78%); -webkit-background-clip: text; background-clip: text; }
  .panel .tagline { font-size: 17px; color: #d8efe9; margin: 4px 0 14px; }
  .panel .rules { font-size: 14px; line-height: 1.55; color: #a8cfc8; margin: 0 auto 20px; max-width: 480px; text-align: left; }
  .panel .rules b { color: #ffe9b0; }
  .big-btn {
    font-family: inherit; font-size: 20px; font-weight: 900; letter-spacing: .08em;
    color: #2a1a02; background: linear-gradient(180deg, #ffd968, #e8a91c);
    border: 3px solid #7a5a08; border-radius: 12px; padding: 13px 34px; cursor: pointer;
    box-shadow: 0 5px 0 #7a5a08, 0 10px 20px rgba(0,0,0,.5);
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a5a08; }
</style>
</head>
<body>
<main id="app" aria-label="Emberfall Duel: a one-player card battler against an AI duelist"></main>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
